<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">1K間取りイメージ</title>
  <desc id="desc">玄関とキッチン、浴室、トイレ、居室を配置した参考用の間取り図です。</desc>
  <rect width="1000" height="680" fill="#f7f9fb"/>
  <text x="500" y="56" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#203e5a">1K 間取りイメージ</text>
  <text x="500" y="91" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#667085">参考用のイメージ図です。実際の間取りとは異なります。</text>
  <g transform="translate(175 130)">
    <rect x="0" y="0" width="650" height="470" fill="#fff" stroke="#31485d" stroke-width="12"/>
    <path d="M0 150h165M165 0v150M165 150v110M0 260h165M165 260h130M295 150v110M165 150h130M295 0v150M295 150h355" fill="none" stroke="#31485d" stroke-width="10"/>
    <path d="M0 260h165v210H0z" fill="#edf3f7"/>
    <path d="M165 260h130v210H165z" fill="#f2eee7"/>
    <path d="M295 150h355v320H295z" fill="#f7f0e6"/>
    <path d="M0 0h165v150H0z" fill="#eaf3f8"/>
    <path d="M165 0h130v150H165z" fill="#edf3f7"/>
    <text x="82" y="72" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#34495e">浴室</text>
    <text x="230" y="72" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#34495e">トイレ</text>
    <text x="82" y="365" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#34495e">玄関</text>
    <text x="230" y="365" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#34495e">キッチン</text>
    <text x="472" y="305" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#34495e">居室</text>
    <text x="472" y="345" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#667085">約6帖（参考）</text>
    <rect x="390" y="190" width="165" height="76" rx="8" fill="#fff" stroke="#a9bac8" stroke-width="4"/>
    <text x="472" y="237" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#667085">ベッド配置例</text>
    <path d="M395 470h190" stroke="#73a9c9" stroke-width="12"/>
    <text x="490" y="515" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#667085">バルコニー側</text>
  </g>
</svg>
